server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/eye_followup_ledger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  web:
    resources:
      static-locations: file:./frontend/dist/

app:
  jwt:
    # 生产环境请通过环境变量 JWT_SECRET 覆盖（至少 32 字符）
    secret: ${JWT_SECRET:mouji-demo-jwt-secret-key-change-me-2026}
    expire-hours: 8
  admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:Admin@2026}
  storage:
    image-dir: ${IMAGE_DIR:./data/images}
  ocr:
    url: ${OCR_URL:http://127.0.0.1:8001}
    timeout-ms: 120000
  agent:
    enabled: true
    max-concurrent: 2
    queue-size: 20
    llm:
      enabled: ${LLM_ENABLED:false}
      base-url: ${LLM_URL:http://127.0.0.1:11434}
      model: ${LLM_MODEL:qwen3:4b}
      think: false
      num-ctx: 8192
      max-tokens: 1600
      temperature: 0.3
      timeout-ms: 120000
  dashboard:
    cache-ttl-seconds: 300

logging:
  level:
    com.eyefollowup: INFO
  file:
    name: ./logs/backend.log
